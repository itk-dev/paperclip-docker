networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    ports:
      - "3100"
    networks:
      - frontend
      - app
    pids_limit: 2048
    stop_grace_period: 90s
    volumes:
      - ./data/paperclip:/paperclip
    environment:
      - DATABASE_URL=postgres://paperclip:${DB_PASSWORD}@postgres:5432/paperclip
      - PAPERCLIP_PUBLIC_URL=http://${COMPOSE_DOMAIN}
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      - PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.middlewares.paperclip-auth.basicauth.users=${PAPERCLIP_BASIC_AUTH}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${COMPOSE_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.service=${COMPOSE_PROJECT_NAME}"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=paperclip-auth"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=3100"

  postgres:
    image: postgres:17-alpine
    networks:
      - app
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=paperclip
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30

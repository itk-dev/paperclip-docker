networks:
  frontend:
    external: true
  app:
    driver: bridge
    internal: false

services:
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    restart: unless-stopped
    expose:
      - "3100"
    networks:
      - frontend
      - app
    pids_limit: 2048
    stop_grace_period: 90s
    volumes:
      - ./data/paperclip:/paperclip
    environment:
      - DATABASE_URL=postgres://paperclip:${DB_PASSWORD}@postgres:5432/paperclip
      - PAPERCLIP_PUBLIC_URL=https://${COMPOSE_SERVER_DOMAIN}
      - USER_UID=${USER_UID:-1000}
      - USER_GID=${USER_GID:-1000}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET must be set}
      - PAPERCLIP_TOOL_ACTION_SIGNING_SECRET=${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET}
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=frontend"
      - "traefik.http.middlewares.paperclip-auth.basicauth.users=${PAPERCLIP_BASIC_AUTH}"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

      # HTTP Router (for redirect)
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.rule=Host(`${COMPOSE_SERVER_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.entrypoints=web"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-http.middlewares=redirect-to-https"

      # HTTPS Router
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.rule=Host(`${COMPOSE_SERVER_DOMAIN}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.service=${COMPOSE_PROJECT_NAME}-paperclip"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}-https.middlewares=paperclip-auth"

      # Service
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}-paperclip.loadbalancer.server.port=3100"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    networks:
      - app
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=paperclip
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=paperclip
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 2s
      timeout: 5s
      retries: 30
